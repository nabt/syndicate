<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syndicate · Projects</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:15px system-ui,sans-serif;background:#0b0d12;color:#d8dae2;margin:0;padding:32px;max-width:1200px;margin:auto}h1{font-size:24px;margin:0}h2{font-size:18px}header,.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.muted,small{color:#9ba5ba}button,input,select{font:inherit;color:inherit;background:#151822;border:1px solid #394055;border-radius:6px;padding:9px}button,summary{cursor:pointer}button:hover,a:hover{color:#fff}a{color:#9bbdff}input{flex:1;min-width:180px}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:16px 12px;border-bottom:1px solid #262b3a}th{font-size:12px;color:#9ba5ba}td{vertical-align:top}td:first-child{width:23%}.badge{display:inline-block;font-size:12px;border-radius:20px;padding:4px 9px;background:#252d43;white-space:nowrap}.attention{color:#ffd18a;background:#3a2a10}.working{color:#8ce6af;background:#123420}.path{font-size:12px;color:#9ba5ba;overflow-wrap:anywhere;margin-top:5px}.task{padding:16px 0;border-bottom:1px solid #262b3a}.task p{margin:8px 0}details{margin-top:24px}summary{color:#9ba5ba}pre{white-space:pre-wrap}#notice{color:#ffd18a}#updated{margin-top:24px;font-size:12px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #9bbdff;outline-offset:3px}.table-wrap{overflow:auto}.description{max-width:480px;overflow-wrap:anywhere}@media(max-width:650px){body{padding:18px}td,th{padding:12px 8px}.optional{display:none}}
</style>
<header><h1>Syndicate</h1><span class="muted">Projects</span></header>
<p id="counts" aria-live="polite"></p>
<div class="controls"><input id="search" type="search" aria-label="Search projects" placeholder="Search repos or paths…"><select id="filter" aria-label="Filter projects"><option value="all">All projects</option><option value="unfinished">Unfinished</option><option value="attention">Needs attention</option></select><button id="view">List projects</button></div>
<p id="notice" role="status"></p>
<main id="content">Loading projects…</main>
<details id="usage"><summary>Account limits</summary><pre id="limits">Expand to load account limits.</pre></details>
<p id="updated" class="muted"></p>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[],list=false,lastData='';
function age(value){if(!value)return '—';const time=Date.parse(value);if(!Number.isFinite(time))return '—';const m=Math.max(0,Math.floor((Date.now()-time)/60000));return m<1?'Just now':m<60?`${m} min ago`:m<1440?`${Math.floor(m/60)} hr ago`:new Date(time).toLocaleDateString();}
function badge(s){return `<span class="badge ${s==='Needs attention'?'attention':s==='Working'?'working':''}">${esc(s)}</span>`;}
function link(r){return `<a href="#${encodeURIComponent(r.path)}">${esc(r.name)}</a><div class="path">${esc(r.path)}</div>`;}
function task(t){return `<div class="task"><strong>${esc(t.summary||'Untitled task')}</strong> <span class="badge">${esc(t.state||'unknown')}</span>${t.progress&&t.progress!==t.summary?`<p>${esc(t.progress)}</p>`:''}<p class="muted">Updated ${esc(age(t.completed_at||t.updated_at))}</p></div>`;}
function render(){
 $('counts').textContent=`${rows.length} projects · ${rows.filter(r=>r.project_status==='Working').length} working · ${rows.filter(r=>r.project_status==='Needs attention').length} need attention`;
 let selected;try{selected=decodeURIComponent(location.hash.slice(1));}catch{selected='invalid';}
 const opened=new Set([...document.querySelectorAll('main details[open]')].map(e=>e.id));
 if(selected){const r=rows.find(r=>r.path===selected);$('content').innerHTML='<a href="#">← All projects</a>'+(r?`<h2>${esc(r.name)} ${badge(r.project_status)}</h2><p class="path">${esc(r.path)}</p><h2>${r.tasks.length?'Unfinished tasks ('+r.tasks.length+')':'Last completed task'}</h2>${r.tasks.length?r.tasks.map(task).join(''):r.last_completed?task(r.last_completed):'<p class="muted">No task details reported yet.</p>'}<details id="history"><summary>Activity history (${r.history.length})</summary>${r.history.slice().reverse().map(h=>`<p>${esc(h.summary)} <small>${esc(h.outcome||h.event)} · ${esc(age(h.at))}</small></p>`).join('')||'<p>No history yet.</p>'}</details>`:'<p>Project not found in the registry.</p>');}
 else{const query=$('search').value.toLowerCase();const visible=rows.filter(r=>(r.name+' '+r.path).toLowerCase().includes(query)).filter(r=>$('filter').value==='all'||($('filter').value==='unfinished'?r.unfinished_count>0:r.project_status==='Needs attention'));
 $('content').innerHTML=visible.length?`<div class="table-wrap"><table><thead><tr><th>Project</th><th>Status</th>${list?'':'<th>Current / latest task</th><th>Unfinished</th><th class="optional">Updated</th>'}</tr></thead><tbody>${visible.map(r=>{const t=r.tasks[0]||r.last_completed;return `<tr><td>${link(r)}</td><td>${badge(r.project_status)}</td>${list?'':`<td class="description">${esc(t?.summary||'No task details reported')}${t?.progress&&t.progress!==t.summary?`<div class="path">${esc(t.progress)}</div>`:''}${!r.tasks.length&&t?'<div class="path">Last completed</div>':''}</td><td>${r.unfinished_count}</td><td class="optional">${esc(age(r.updated_at))}</td>`}</tr>`;}).join('')}</tbody></table></div>`:`<p class="muted">${rows.length?'No projects match these filters.':'No registered projects. Run syndicate init in a repo to register it.'}</p>`;}
 for(const id of opened){const e=$(id);if(e)e.open=true;}
}
async function tick(){try{const res=await fetch('/api/status',{cache:'no-store'});if(!res.ok)throw Error();const data=await res.json();if(!Array.isArray(data))throw Error();rows=data;const serialized=JSON.stringify(data);if(serialized!==lastData){render();lastData=serialized;}$('notice').textContent='';$('updated').textContent='Last refreshed '+new Date().toLocaleTimeString();}catch{$('notice').textContent='Unable to refresh. Showing the last available data.';}finally{setTimeout(tick,5000);}}
let limitsBusy=false;
async function refreshLimits(){if(!$('usage').open||limitsBusy)return;limitsBusy=true;try{const res=await fetch('/api/limits',{cache:'no-store'});if(!res.ok)throw Error();$('limits').textContent=(await res.json()).summary;}catch{$('limits').textContent='Unable to refresh account limits. Retrying shortly.';}finally{limitsBusy=false;}}
$('usage').addEventListener('toggle',refreshLimits);
setInterval(refreshLimits,5000);
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('view').addEventListener('click',()=>{list=!list;location.hash='';$('view').textContent=list?'Project overview':'List projects';render();});window.addEventListener('hashchange',render);tick();
</script>
</html>
